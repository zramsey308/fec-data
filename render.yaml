# Render Blueprint — deploy Clawbot as a web service
services:
  - type: web
    name: clawbot
    runtime: docker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clawbot-db
          property: connectionString
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: FEC_CYCLE
        value: "2024"
      - key: FEC_CHUNK_SIZE
        value: "50000"

databases:
  - name: clawbot-db
    plan: starter
    databaseName: clawbot
