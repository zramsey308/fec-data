# Render Blueprint — deploy Clawbot as a static site
services:
  - type: web
    name: clawbot
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: public
    envVars:
      - key: FEC_CYCLES
        value: "2024,2026"
      - key: FEC_CHUNK_SIZE
        value: "50000"
      - key: PYTHON_VERSION
        value: "3.11.0"
