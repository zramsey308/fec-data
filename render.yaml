# Render Blueprint — deploy Clawbot as a static site
services:
  - type: web
    name: clawbot
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: public
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: FEC_CYCLE
        value: "2024"
      - key: FEC_CHUNK_SIZE
        value: "50000"
      - key: PYTHON_VERSION
        value: "3.11.0"
